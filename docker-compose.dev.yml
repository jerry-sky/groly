services:
  groly-dev:
    build:
      context: .
      dockerfile: Dockerfiledev
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - .:/app
      - groly-dev-node_modules:/app/node_modules
      - groly-dev-data:/app/data
    environment:
      - NODE_ENV=development
      - DATABASE_URL=/app/data/groly.db
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ORIGIN=${ORIGIN:-http://localhost:3000}
    command:
      [
        "sh",
        "-c",
        "pnpm run dev --host 0.0.0.0 --port 3000"
      ]
    stdin_open: true
    tty: true

volumes:
  groly-dev-node_modules:
  groly-dev-data:
